# The `user` line is rewritten by the entrypoint from RUN_AS — the workers are what
# reach the volume, so who they are is the whole permission story.
user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # Straight to the container's stdout and stderr — a refused upload or a
    # permission problem leaves its only trace here, and `dxflow workflow logs`
    # is where it has to show up
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # An upload arrives one chunk per request, so the body ceiling is php's
    # post_max_size — sized from UPLOAD_CHUNK_SIZE at start — and nginx gets out of
    # the way rather than adding a second, stricter limit to reason about.
    client_max_body_size 0;
    client_body_temp_path /data/tmp/nginx;

    # A download and a batch archive are streamed out of php as they are read, and a
    # large one takes as long as it takes
    fastcgi_buffering off;
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;

    server {
        listen 8080;
        server_name _;

        root /var/www/filegator/dist;
        index index.php;

        # Everything that is not a built asset is the app: routes travel as ?r=...,
        # so the query string has to survive the rewrite
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # dist/ holds exactly one php file, and it is the only one worth executing
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }
}

; Read after the image's own www.conf and zz-docker.conf — same pool, so these
; settings win. The entrypoint adds the pool's user from RUN_AS in a file of its own.
[www]

; nginx is the only client, and it is in this container. Who may open the socket
; follows RUN_AS, so the entrypoint sets listen.owner alongside the pool user.
listen = /run/php-fpm.sock
listen.mode = 0660

; A browser uploads three chunks at a time and the admin browses while it does, so
; a handful of workers is enough — and each one holds memory_limit at worst
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; The step's environment reaches php, and a warning or a stack trace reaches the
; container's stderr, which is what `dxflow workflow logs` shows
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

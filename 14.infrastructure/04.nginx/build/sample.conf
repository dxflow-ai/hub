# Example configuration for the dxflow nginx workflow.
#
# This file is a .sample, so nginx never reads it — copy a block out of it into a
# file whose name ends in .conf and the server picks it up within RELOAD_INTERVAL
# seconds, with no restart. A file nginx rejects is reported in the workflow log
# and never loaded, so the running server keeps serving while you fix it.
#
#   conf.d/*.conf     read at the http level — whole server blocks, upstreams, maps
#   server.d/*.conf   read inside the default server on :8080 — locations, routes
#   nginx.conf        read instead of everything above, if you put one here
#
# ---------------------------------------------------------------------------
# server.d/proxy.conf — put a service behind the same link as the artifacts
# ---------------------------------------------------------------------------
#
# location /api/ {
#     proxy_pass http://10.0.0.7:9000/;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
#     # A streamed answer should not be held back until it is complete
#     proxy_buffering off;
#     proxy_read_timeout 3600s;
# }
#
# ---------------------------------------------------------------------------
# server.d/public.conf — one directory anyone may read, password or not
# ---------------------------------------------------------------------------
#
# location /public/ {
#     auth_basic off;
#     alias /volume/output/;
#     autoindex on;
# }
#
# ---------------------------------------------------------------------------
# server.d/report.conf — a run's html report, served as a site of its own
# ---------------------------------------------------------------------------
#
# location /report/ {
#     alias /volume/runs/latest/report/;
#     index index.html;
#     try_files $uri $uri/ =404;
# }
#
# ---------------------------------------------------------------------------
# conf.d/site.conf — a second site, on the spare published port
# ---------------------------------------------------------------------------
#
# server {
#     listen 8081;
#     server_name _;
#
#     root /volume/site;
#     index index.html;
#
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
#
# ---------------------------------------------------------------------------
# conf.d/upstream.conf — spread requests over several backends
# ---------------------------------------------------------------------------
#
# upstream workers {
#     least_conn;
#     server 10.0.0.11:8000;
#     server 10.0.0.12:8000;
# }
#
# ... then, in server.d/workers.conf:
#
# location /predict/ {
#     proxy_pass http://workers/;
# }

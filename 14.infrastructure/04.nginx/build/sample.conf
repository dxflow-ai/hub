# Worked examples for the dxflow nginx workflow.
#
# This file is a .sample, so nginx never reads it and editing it cannot break
# anything. Copy a block out of it into a file whose name ends in .conf, and the
# server has it within RELOAD_INTERVAL seconds — no restart, no redeploy.
#
#   conf.d/*.conf       read at the http level — whole server blocks, upstreams, maps
#   server.d/*.conf     read inside the site server on :8080 — locations, routes
#   nginx.conf          read instead of everything above, if you put one here
#
#   state/status.log    what happened on each check: reloaded, or rejected and why
#   state/effective.conf  the configuration as nginx resolved it, includes and all
#
# Ports 8081 and 8082 are published and unused — a server block you write can
# listen on either, which is the only way to reach one, since a published port
# cannot be added to a running workflow.
#
# ===========================================================================
# Publishing artifacts
# ===========================================================================
#
# --- server.d/report.conf — one run's html report, at a path of its own -----
#
# location /report/ {
#     alias /volume/runs/latest/report/;
#     index index.html;
#     try_files $uri $uri/ =404;
# }
#
# --- server.d/public.conf — one directory anyone may read, password or not --
#
# location /public/ {
#     auth_basic off;
#     alias /volume/output/;
#     autoindex on;
# }
#
# --- server.d/data.conf — a dataset a browser app fetches cross-origin ------
#
# location /data/ {
#     alias /volume/output/;
#     add_header Access-Control-Allow-Origin "*" always;
#     add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
#
#     # A result set is written once and read many times
#     expires 1h;
# }
#
# --- server.d/download.conf — force the browser to save, not render ---------
#
# location ~* \.(xtc|trr|edr|bam|cram|h5|nc)$ {
#     add_header Content-Disposition "attachment" always;
# }
#
# ===========================================================================
# Things worth trying in a configuration session
# ===========================================================================
#
# --- conf.d/site.conf — a second site, on one of the spare ports ------------
#
# server {
#     listen 8081;
#     server_name _;
#
#     root /volume/site;
#     index index.html;
#
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
#
# --- server.d/proxy.conf — put a service behind this workflow's link --------
#
# location /api/ {
#     proxy_pass http://10.0.0.7:9000/;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
#     # A streamed answer should not be held back until it is complete
#     proxy_buffering off;
#     proxy_read_timeout 3600s;
# }
#
# --- conf.d/upstream.conf — spread requests over several backends -----------
#
# upstream workers {
#     least_conn;
#     server 10.0.0.11:8000;
#     server 10.0.0.12:8000;
# }
#
# ... then, in server.d/workers.conf:
#
# location /predict/ {
#     proxy_pass http://workers/;
# }
#
# --- conf.d/limits.conf — what a rate limit actually does -------------------
#
# limit_req_zone $binary_remote_addr zone=artifacts:10m rate=10r/s;
#
# ... then, in server.d/limited.conf:
#
# location /heavy/ {
#     limit_req zone=artifacts burst=20 nodelay;
#     alias /volume/output/;
# }
#
# --- server.d/headers.conf — read these back with curl -I ------------------
#
# location /headers/ {
#     alias /volume/output/;
#     add_header X-Served-By "dxflow nginx" always;
#     add_header Cache-Control "no-store" always;
# }

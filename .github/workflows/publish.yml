name: publish

on:
    workflow_dispatch:
        inputs:
            # Refresh with ./.github/scripts/options.sh after adding an entry
            workflow:
                description: "Workflow to publish"
                required: true
                type: choice
                options:
                    - fastqc
                    - samtools
                    - pangolin
                    - gromacs
                    - pymol
                    - scipion
                    - jupyter
                    - rstudio
                    - ollama
                    - openfoam
                    - su2
                    - paraview
                    - visit
                    - vscode
                    - coder
                    - fedora
                    - ubuntu
                    - void
                    - chromium
                    - firefox
                    - vivaldi
                    - gimp
                    - inkscape
                    - signal
                    - telegram
            dependents:
                description: "Also rebuild the workflows built on top of it"
                required: false
                default: true
                type: boolean

permissions:
    contents: read
    packages: write

concurrency:
    group: publish-${{ inputs.workflow }}

jobs:
    select:
        runs-on: ubuntu-latest
        outputs:
            wave1_builds: ${{ steps.select.outputs.wave1_builds }}
            wave1_workflows: ${{ steps.select.outputs.wave1_workflows }}
            wave2_builds: ${{ steps.select.outputs.wave2_builds }}
            wave2_workflows: ${{ steps.select.outputs.wave2_workflows }}
        steps:
            - uses: actions/checkout@v5

            - name: Select workflows
              id: select
              env:
                  INPUT: ${{ inputs.workflow }}
                  DEPENDENTS: ${{ inputs.dependents }}
              run: ./.github/scripts/select.sh

    # A wave publishes only once the wave it builds on has, so a rebuilt base is on
    # the registry before its dependents pull it. Wave 2 is skipped for an entry
    # nothing is built on, and a chain deeper than these two is refused up front by
    # select.sh — a third level means a wave3 job here and WAVES=3 in select.sh.
    wave1:
        needs: select
        if: needs.select.outputs.wave1_builds != ''
        uses: ./.github/workflows/image.yml
        permissions:
            contents: read
            packages: write
        with:
            builds: ${{ needs.select.outputs.wave1_builds }}
            workflows: ${{ needs.select.outputs.wave1_workflows }}

    wave2:
        needs: [select, wave1]
        if: needs.select.outputs.wave2_builds != ''
        uses: ./.github/workflows/image.yml
        permissions:
            contents: read
            packages: write
        with:
            builds: ${{ needs.select.outputs.wave2_builds }}
            workflows: ${{ needs.select.outputs.wave2_workflows }}

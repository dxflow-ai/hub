name: 🐛 Workflow Problem
description: Report a problem with an existing workflow in the hub.
title: "[Workflow Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Found a workflow that's broken, outdated, or incorrect? Let us know below.
    - type: checkboxes
      id: preflight
      attributes:
          label: Before you start
          options:
              - label: I have searched the [existing issues](https://github.com/dxflow-ai/hub/issues) and this hasn't been reported yet.
                required: true
    - type: dropdown
      id: domain
      attributes:
          label: Category
          description: Which category is the workflow in?
          options:
              - Getting Started
              - Genomics
              - Molecular
              - Structural
              - Analytics
              - AI
              - Simulation
              - Visualization
              - Development
              - Desktop
              - Browser
              - Graphics
              - Messaging
              - Infrastructure
              - Office
              - Media
              - Engineering
              - Geospatial
              - Utilities
              - Other
      validations:
          required: true
    - type: input
      id: workflow
      attributes:
          label: Which workflow?
          description: The key you deploy it by — `dxflow workflow create hub://<key>` — or the path to its folder.
          placeholder: e.g. fastqc, or 02.genomics/01.fastqc
      validations:
          required: true
    - type: dropdown
      id: kind
      attributes:
          label: Type of problem
          options:
              - Won't deploy / start
              - Crashes or errors at runtime
              - Wrong or missing output
              - Outdated image or version
              - Incorrect configuration / resources
              - Uploaded files don't reach the workflow
              - Documentation in the entry is wrong
              - Other
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What's wrong?
          description: Describe the problem — what happens, and what you expected instead.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs / output
          description: Paste any relevant error output. Automatically formatted as code.
          render: shell
      validations:
          required: false
    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Anything else that might help.
      validations:
          required: false
